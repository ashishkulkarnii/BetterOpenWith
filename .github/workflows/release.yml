name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Build release app
        run: >-
          xcodebuild
          -project BetterOpenWith.xcodeproj
          -scheme BetterOpenWith
          -configuration Release
          -sdk macosx
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          build

      - name: Package app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/DerivedData/Build/Products/Release/Better Open With.app"
          "BetterOpenWith-${GITHUB_REF_NAME}.zip"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "BetterOpenWith-${GITHUB_REF_NAME}.zip" --clobber
